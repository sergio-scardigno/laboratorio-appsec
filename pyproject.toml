[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "appsec-lab"
version = "0.1.0"
description = "Laboratorio AppSec: Semgrep, SonarQube y ZAP con hallazgos mapeados al OWASP Top 10:2025"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "jinja2>=3.1", "typer>=0.12", "python-multipart>=0.0.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
lab = "lab.cli:app"

[tool.setuptools]
packages = ["lab", "lab.runners", "lab.web"]

[tool.setuptools.package-data]
"lab.web" = ["templates/*.html"]
"lab" = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
